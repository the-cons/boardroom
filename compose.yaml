services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://boardroom:boardroom@db:5432/boardroom
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: boardroom
      POSTGRES_USER: boardroom
      POSTGRES_PASSWORD: boardroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardroom -d boardroom"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
